name: Build Milo Home APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-milo-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct game and generate Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT=milo-home-android
          mkdir -p "$ROOT/app/src/main/assets/www"
          cat milo-build-input/payload-*.b64 | base64 -d | gzip -d > "$ROOT/app/src/main/assets/www/index.html"
          echo "48bbf59cc1da863087ed7f8889309eba65a422e784ad2153817f67789050a7b3  $ROOT/app/src/main/assets/www/index.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path

          root = Path('milo-home-android')
          files = {
              'settings.gradle': '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MiloHome'
          include ':app'
          ''',
              'build.gradle': '''plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          ''',
              'gradle.properties': '''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          ''',
              'app/build.gradle': '''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.daniyal.milohome'
              compileSdk 35

              defaultConfig {
                  applicationId 'io.daniyal.milohome'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ''',
              'app/src/main/AndroidManifest.xml': '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="خانه میلو"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''',
              'app/src/main/res/values/strings.xml': '''<resources>
              <string name="app_name">خانه میلو</string>
          </resources>
          ''',
              'app/src/main/res/values/styles.xml': '''<resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0F1117</item>
                  <item name="android:navigationBarColor">#0F1117</item>
                  <item name="android:windowBackground">#0F1117</item>
                  <item name="android:colorAccent">#D39A5C</item>
              </style>
          </resources>
          ''',
              'app/src/main/java/io/daniyal/milohome/MainActivity.java': '''package io.daniyal.milohome;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());
                  webView.setBackgroundColor(0xFF0F1117);
                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onPause() {
                  if (webView != null) webView.onPause();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }
          }
          '''
          }

          for rel, text in files.items():
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              # Dedent the workflow-friendly indentation from generated files.
              import textwrap
              path.write_text(textwrap.dedent(text).lstrip(), encoding='utf-8')
          PY

      - name: Build installable APK
        working-directory: milo-home-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=milo-home-android/app/build/outputs/apk/debug/app-debug.apk
          OUT=MiloHome-v1.0.0-Android.apk
          test -s "$APK"
          cp "$APK" "$OUT"
          unzip -t "$OUT" >/dev/null
          unzip -l "$OUT" | grep -q 'assets/www/index.html'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT" | head -1 | tee MiloHome-package.txt
          grep -q "name='io.daniyal.milohome'" MiloHome-package.txt
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiloHome-Android-APK
          path: |
            MiloHome-v1.0.0-Android.apk
            MiloHome-v1.0.0-Android.apk.sha256
            MiloHome-package.txt
          if-no-files-found: error
          retention-days: 7
