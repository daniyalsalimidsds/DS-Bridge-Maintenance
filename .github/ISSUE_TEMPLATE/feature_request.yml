name: Feature request / پیشنهاد قابلیت
description: Propose an improvement with a clear operational or engineering need.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or engineering need / نیاز عملیاتی یا مهندسی
      description: Explain the current problem and the outcome you need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / رفتار پیشنهادی
      description: Describe the proposed change and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Engineering basis or references / مبنای مهندسی
      description: For scoring, classification, thresholds, or safety logic, include the source, version, and clause when available.
  - type: textarea
    id: compatibility
    attributes:
      label: Data and compatibility impact
      description: Note any effect on existing records, identifiers, scoring, exports, migrations, or older app versions.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand proposed engineering rules require supporting evidence and maintainer review before adoption.
          required: true
