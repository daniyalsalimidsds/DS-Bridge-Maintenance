name: Bug report / گزارش اشکال
description: Report a reproducible problem using synthetic or de-identified data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Bridge Maintenance.
        لطفاً فقط از دادهٔ آزمایشی یا بی‌نام‌سازی‌شده استفاده کنید.
  - type: input
    id: version
    attributes:
      label: App version / نسخه برنامه
      placeholder: "e.g. 1.6.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android and device / اندروید و دستگاه
      placeholder: "e.g. Android 14, Pixel 7"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / مراحل بازتولید
      description: Provide the smallest reproducible sequence using test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs observed / انتظار و نتیجه مشاهده‌شده
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence / شواهد غیرحساس
      description: Add logs or screenshots only after removing real bridge data, sensitive GPS, signatures, credentials, and keys.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I removed sensitive, personal, operational, and real bridge data from this report.
          required: true
