org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
# AGP 8.7 UTP host plugin can fail before tests with missing Kotlin EnumEntriesKt.
# Android's documented fallback keeps connected instrumentation on the legacy Gradle pipeline.
android.experimental.androidTest.useUnifiedTestPlatform=false
# The build container exposes a JRE without jlink; use the legacy javac path.
android.disableJdkImageTransform=true
